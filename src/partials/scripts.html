  <!-- ═══ V8 · FAQ panneau déroulant ═══ -->
  <script>
    (function() {
      const toggle = document.getElementById('faqMasterToggle');
      const master = document.getElementById('faqMaster');
      if (!toggle || !master) return;

      const total = master.querySelectorAll('.faq-item').length;

      toggle.addEventListener('click', () => {
        const isOpen = master.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        const label = toggle.querySelector('.faq-master-toggle-info');
        if (label) {
          const info = label.querySelector('span');
          if (isOpen) {
            label.childNodes[label.childNodes.length - 1].textContent = ' Masquer les questions';
            if (info) info.textContent = total + ' questions · cliquez pour masquer';
          } else {
            label.childNodes[label.childNodes.length - 1].textContent = ' Voir les questions fréquentes';
            if (info) info.textContent = total + ' questions · cliquez pour afficher';
          }
        }
      });
    })();
  </script>

  <!-- ═══ V18 · Correction menu mobile : fermeture clic extérieur + stabilité ═══ -->
  <script>
    (function() {
      const toggle = document.getElementById('navToggle');
      const menu = document.getElementById('navMobile');
      if (!toggle || !menu) return;

      // Crée un overlay cliquable derrière le menu pour le fermer
      let overlay = document.getElementById('navMobileOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'navMobileOverlay';
        overlay.className = 'nav-mobile-overlay';
        overlay.setAttribute('aria-hidden', 'true');
        document.body.appendChild(overlay);
      }

      const closeMenu = () => {
        menu.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('visible');
        document.body.style.overflow = '';
      };

      // Fermeture en cliquant sur l'overlay (zone derrière)
      overlay.addEventListener('click', closeMenu);

      // Fermeture quand on clique en dehors du menu
      document.addEventListener('click', (e) => {
        if (!menu.classList.contains('open')) return;
        // Si le clic est sur le toggle ou DANS le menu, on laisse faire
        if (toggle.contains(e.target) || menu.contains(e.target)) return;
        closeMenu();
      });

      // Synchronise l'overlay avec l'ouverture du menu (observe les changements de classe)
      const observer = new MutationObserver(() => {
        if (menu.classList.contains('open')) {
          overlay.classList.add('visible');
        } else {
          overlay.classList.remove('visible');
        }
      });
      observer.observe(menu, { attributes: true, attributeFilter: ['class'] });

      // Fermeture sur swipe vertical (gestuelle naturelle mobile)
      let touchStartY = 0;
      menu.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      menu.addEventListener('touchmove', (e) => {
        const deltaY = e.touches[0].clientY - touchStartY;
        // Swipe vers le haut > 80px ferme le menu
        if (deltaY < -80 && menu.classList.contains('open')) {
          closeMenu();
        }
      }, { passive: true });

    })();
  </script>

  <!-- ═══ V18 · Styles correctifs menu mobile (overlay + stabilité) ═══ -->
  <style>
    /* Overlay cliquable derrière le menu mobile */
    .nav-mobile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 42, 31, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 89;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s var(--ease, ease);
    }
    .nav-mobile-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Stabilisation du menu mobile : on l'ancre proprement, plus de flottement */
    .nav-mobile {
      position: fixed !important;
      top: 0 !important;
      left: auto !important;
      right: 0 !important;
      width: min(360px, 88vw) !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      transform: translateX(102%) !important;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      will-change: transform;
      z-index: 90 !important;
      box-shadow: -10px 0 40px -15px rgba(0, 0, 0, 0.25);
      padding: calc(var(--header-h, 78px) + 1.5rem) 1.75rem 2rem !important;
    }
    .nav-mobile.open {
      transform: translateX(0) !important;
    }

    /* Indicateur visuel de fermeture en haut du menu (petit trait) */
    .nav-mobile::before {
      content: '';
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: rgba(26, 58, 46, 0.2);
      border-radius: 2px;
    }

    /* Sur très petits écrans on prend toute la largeur */
    @media (max-width: 480px) {
      .nav-mobile {
        width: 100vw !important;
      }
    }
  </style>
