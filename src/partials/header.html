  <!-- ═══════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════ -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="{{ site.name }} — accueil">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 3C10 9 6 14 6 19c0 5 4 9 10 9s10-4 10-9c0-5-4-10-10-16z" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.18"/>
            <path d="M16 28V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M16 15l-3.5-2.5M16 19l-4.5-3M16 23l-3.5-2.5M16 15l3.5-2.5M16 19l4.5-3M16 23l3.5-2.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo-text">
          <span class="logo-main">{{ site.name }}</span>
          <span class="logo-sub">— Jardin botanique tropical —</span>
        </span>
      </a>
      <nav class="nav-desktop" aria-label="Navigation principale">
        <a href="/jardin-botanique-reunion/">Le jardin</a>
        <a href="/ecoles-groupes/">Écoles &amp; groupes</a>
        <a href="/#infos">Infos pratiques</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="navMobile">
        <span></span><span></span><span></span>
      </button>
    </div>
    <!-- Menu mobile immersif -->
    <div class="nav-mobile" id="navMobile" aria-hidden="true">
      <div class="nav-mobile-deco" aria-hidden="true">
        <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 20c-100 140-160 320-160 440 0 80 60 140 160 140s160-60 160-140c0-120-60-300-160-420z" fill="currentColor" opacity="0.06"/>
          <path d="M80 100c60 80 100 200 100 300M320 100c-60 80-100 200-100 300" stroke="currentColor" stroke-width="0.5" opacity="0.15" fill="none"/>
        </svg>
      </div>
      <nav aria-label="Navigation mobile">
        <a href="/jardin-botanique-reunion/" class="nav-mobile-link"><span>01</span>Le jardin</a>
        <a href="/ecoles-groupes/" class="nav-mobile-link"><span>02</span>Écoles &amp; groupes</a>
        <a href="/#infos" class="nav-mobile-link"><span>03</span>Infos pratiques</a>
        <a href="/#faq" class="nav-mobile-link"><span>04</span>Questions fréquentes</a>
      </nav>
      <div class="nav-mobile-foot">
        <a href="{{ phoneHref }}" class="btn btn-primary nav-mobile-cta">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ contact.phoneDisplay }}
        </a>
        <p class="nav-mobile-addr">{{ address.street }}<br/>{{ address.locality }}</p>
      </div>
    </div>
  </header>
